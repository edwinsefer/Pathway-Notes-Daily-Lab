name: Scripture Integrity

on:
  push:
    branches: [main]
    paths:
      - "src/data/scripture/**"
      - "scripts/audit-scripture.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scripture-integrity.yml"
  pull_request:
    paths:
      - "src/data/scripture/**"
      - "scripts/audit-scripture.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scripture-integrity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scripture structural audit
        run: npm run audit:scripture
