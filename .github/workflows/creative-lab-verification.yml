name: Creative Laboratory Verification

on:
  push:
    branches:
      - feature/library-backup-and-search-fix
  pull_request:
    branches:
      - main

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Scripture structural audit
        run: npm run audit:scripture
